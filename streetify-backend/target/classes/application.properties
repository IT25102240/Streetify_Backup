# ═══════════════════════════════════════════════════════════════
#  Streetify Backend — application.properties
#  IMPORTANT: Replace placeholder values before running.
# ═══════════════════════════════════════════════════════════════

# ─── Server ───────────────────────────────────────────────────
server.port=8080

# ─── MSSQL Database Connection ────────────────────────────────
# Replace YOUR_SERVER_NAME with your SQL Server instance name.
# Common values: localhost, localhost\SQLEXPRESS, .\SQLEXPRESS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=streetify_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1111
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ─── JPA / Hibernate ──────────────────────────────────────────
# update  — auto-creates/alters tables on startup (use for dev)
# validate — only validates schema (use for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ─── JWT Configuration ────────────────────────────────────────
# IMPORTANT: Replace with a strong random 256-bit Base64 key in production.
# Generate with: openssl rand -base64 32
streetify.jwt.secret=U3RyZWV0aWZ5U2VjcmV0S2V5Rm9ySldfVG9rZW5TaWduaW5nMjAyNg==
streetify.jwt.access-token-expiry=900000
# 15 minutes in milliseconds (15 * 60 * 1000)
streetify.jwt.refresh-token-expiry=604800000
# 7 days in milliseconds

# ─── File Upload (Driver Documents) ──────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
streetify.upload.directory=./uploads/documents

# ─── WebSocket ────────────────────────────────────────────────
# WebSocket endpoint is /ws (configured in WebSocketConfig.java)

# ─── CORS ─────────────────────────────────────────────────────
# Vite dev server runs on port 5173
streetify.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── Logging ──────────────────────────────────────────────────
logging.level.com.streetify=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# ─── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Platform Commission Rate ─────────────────────────────────
streetify.commission.rate=0.15
# 15% platform commission on each trip fare
